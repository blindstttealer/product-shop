version: '3.8'
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL} # из .env или передаём при сборке
    image: tech-react-app:latest
    ports:
      - '8080:80'
    restart: unless-stopped
    env_file:
      - .env # чтобы остальные REACT_APP_* переменные подхватились
